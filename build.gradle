plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'dev.yumi.gradle.licenser' version "${licenser_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()
	mavenCentral()
	// ModMenu
	maven { url = 'https://maven.terraformersmc.com/' }
	// OWO lib
	maven { url = 'https://maven.wispforest.io' }
	maven { url = 'https://jitpack.io' }
	// YACL
	maven { url = 'https://maven.isxander.dev/releases' }
	// ChatImprover
	maven {
        url = uri("https://maven.pkg.github.com/Ayoree/ChatImprover")
        credentials {
            username = 'Ayoree'
            password = System.getenv("AYOREE_GET_PACKAGES_KEY") // Ask for it, if you want
        }
   	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// `AutoService` annotation
	compileOnly 'com.google.auto.service:auto-service:1.1.1'
	annotationProcessor 'com.google.auto.service:auto-service:1.1.1'

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Chat improver
	implementation "org.ayoree:chatimprover:${chat_improver_version}"

	// OWO Lib
	implementation "io.wispforest:owo-lib:${project.owo_version}"
	annotationProcessor "io.wispforest:owo-lib:${project.owo_version}"

	// Modmenu
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// YACL
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

license {
	rule(file("HEADER.txt"))
	include("**/*.java")
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
	}
}
